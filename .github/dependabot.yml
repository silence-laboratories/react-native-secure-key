version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      routine-version-updates:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
  - package-ecosystem: bundler
    directory: /example
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      routine-version-updates:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      routine-version-updates:
        applies-to: version-updates
        patterns:
          - '*'
  - package-ecosystem: gradle
    directories:
      - /android
      - /example/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      routine-version-updates:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
